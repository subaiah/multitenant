name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The Prisma configs read these; generate does not connect.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      TENANT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_tenant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npx tsc --noEmit
      - name: Typecheck scripts and tests
        run: npx tsc -p tsconfig.check.json
      - run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    # Tenants seeded by the tests rotate through all three isolation modes
    # ("mixed"); the other runs put every tenant in one mode
    strategy:
      fail-fast: false
      matrix:
        tenant-mode: [mixed]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Control plane (the app's own account), and the tenant server's three
      # roles from prisma/tenant/setup-roles.sql: none is a superuser, so row-
      # level security is tested for real
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      TENANT_DATABASE_URL: postgresql://tenant_owner:owner@localhost:5432/ci_tenant
      TENANT_PROVISIONER_URL: postgresql://tenant_provisioner:prov@localhost:5432/postgres
      TENANT_PLATFORM_URL: postgresql://tenant_platform:plat@localhost:5432/ci_tenant
      TEST_TENANT_MODE: ${{ matrix.tenant-mode }}
      # Scripts read the same config as the server, which defaults to production
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run prisma:generate
      - name: Set up the tenant database server (roles and shared tenant database)
        run: >-
          PGPASSWORD=ci psql -h localhost -U ci -d postgres
          -v shared_db=ci_tenant -v owner_password=owner -v provisioner_password=prov -v platform_password=plat
          -f prisma/tenant/setup-roles.sql
      - name: PROBE generate a committed tenant baseline
        run: npm run tenant:baseline && ls prisma/tenant/migrations/*/
      - name: Committed migrations match the schema files
        # Skipped while a plane has no committed migrations
        env:
          SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow_control
          TENANT_SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow_tenant
        run: |
          has() { ls "$1"/*/migration.sql >/dev/null 2>&1; }
          for plane in control tenant; do
            dir=prisma/$plane/migrations
            if ! has "$dir"; then echo "$plane: no committed migrations, skipped"; continue; fi
            PGPASSWORD=ci psql -h localhost -U ci -d postgres -c "CREATE DATABASE ci_shadow_$plane"
            cfg=$([ $plane = tenant ] && echo prisma.tenant.config.ts || echo prisma.config.ts)
            schema=$([ $plane = tenant ] && echo prisma/tenant || echo prisma/control/schema.prisma)
            set +e
            npx prisma migrate diff --config $cfg --from-migrations $dir --to-schema $schema --script --exit-code > drift-$plane.txt 2>&1
            code=$?
            set -e
            cat drift-$plane.txt
            # --exit-code: 0 = no difference, 2 = difference, anything else = the check itself failed
            if [ $code -eq 2 ]; then
              echo "::error::The $plane schema changed without a matching migration. Run npm run prisma:migrate$([ $plane = tenant ] && echo :tenant) and commit it."
              grep -vE '^\s*$|^--' drift-$plane.txt | head -15 | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            elif [ $code -ne 0 ]; then
              echo "::error::The $plane drift check couldn't run (exit $code)"
              tail -15 drift-$plane.txt | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            fi
          done
      - name: Control plane schema (migrations when committed, else db push)
        run: |
          if ls prisma/control/migrations/*/migration.sql >/dev/null 2>&1; then npx prisma migrate deploy; else npm run db:push; fi
      - name: Tenant migrations (a throwaway baseline when none are committed)
        run: npm run tenant:baseline && npm run tenant:migrate
      - name: Test
        run: npx tsx --test --test-reporter=tap test/*.test.ts 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report failing tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -A3 -E '^\s*not ok|^\s+error:' test-output.txt | grep -vE '^--$|duration_ms|^\s+---$|type:|location:' | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
