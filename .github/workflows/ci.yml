name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The Prisma configs read these; generate does not connect.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      TENANT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_tenant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npx tsc --noEmit
      - name: Typecheck scripts and tests
        run: npx tsc -p tsconfig.check.json
      - run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    # Tenants seeded by the tests rotate through all three isolation modes
    # ("mixed"); the other runs put every tenant in one mode
    strategy:
      fail-fast: false
      matrix:
        tenant-mode: [mixed, SHARED_TABLES, SCHEMA_PER_TENANT, DATABASE_PER_TENANT]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Control plane (the app's own account), and the tenant server's three
      # roles from prisma/tenant/setup-roles.sql: none is a superuser, so row-
      # level security is tested for real
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      TENANT_DATABASE_URL: postgresql://tenant_owner:owner@localhost:5432/ci_tenant
      TENANT_PROVISIONER_URL: postgresql://tenant_provisioner:prov@localhost:5432/postgres
      TENANT_PLATFORM_URL: postgresql://tenant_platform:plat@localhost:5432/ci_tenant
      TEST_TENANT_MODE: ${{ matrix.tenant-mode }}
      # Scripts read the same config as the server, which defaults to production
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run prisma:generate
      - name: Set up the tenant database server (roles and shared tenant database)
        run: >-
          PGPASSWORD=ci psql -h localhost -U ci -d postgres
          -v shared_db=ci_tenant -v owner_password=owner -v provisioner_password=prov -v platform_password=plat
          -f prisma/tenant/setup-roles.sql
      - name: Committed migrations match the schema files
        # Skipped while a plane has no committed migrations
        env:
          SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow_control
          TENANT_SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow_tenant
        run: |
          has() { ls "$1"/*/migration.sql >/dev/null 2>&1; }
          for plane in control tenant; do
            dir=prisma/$plane/migrations
            if ! has "$dir"; then echo "$plane: no committed migrations, skipped"; continue; fi
            PGPASSWORD=ci psql -h localhost -U ci -d postgres -c "CREATE DATABASE ci_shadow_$plane"
            cfg=$([ $plane = tenant ] && echo prisma.tenant.config.ts || echo prisma.config.ts)
            schema=$([ $plane = tenant ] && echo prisma/tenant || echo prisma/control/schema.prisma)
            set +e
            npx prisma migrate diff --config $cfg --from-migrations $dir --to-schema $schema --script --exit-code > drift-$plane.txt 2>&1
            code=$?
            set -e
            cat drift-$plane.txt
            # --exit-code: 0 = no difference, 2 = difference, anything else = the check itself failed
            if [ $code -eq 2 ]; then
              echo "::error::The $plane schema changed without a matching migration. Run npm run prisma:migrate$([ $plane = tenant ] && echo :tenant) and commit it."
              grep -vE '^\s*$|^--' drift-$plane.txt | head -15 | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            elif [ $code -ne 0 ]; then
              echo "::error::The $plane drift check couldn't run (exit $code)"
              tail -15 drift-$plane.txt | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            fi
          done
      - name: Control plane schema (migrations when committed, else db push)
        run: |
          if ls prisma/control/migrations/*/migration.sql >/dev/null 2>&1; then npx prisma migrate deploy; else npm run db:push; fi
      - name: Tenant migrations (a throwaway baseline when none are committed)
        run: npm run tenant:baseline && npm run tenant:migrate
      - name: Test
        run: npx tsx --test --test-reporter=tap test/*.test.ts 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report failing tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -A3 -E '^\s*not ok|^\s+error:' test-output.txt | grep -vE '^--$|duration_ms|^\s+---$|type:|location:' | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  # Known vulnerabilities in what ships (development tools excluded)
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend
        run: npm audit --omit=dev --audit-level=high

  # The release as it ships: both images built, the Docker Compose stack from
  # deploy/ started with production settings, and a browser journey through it
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Settings (deploy/.env with fresh secrets)
        run: |
          pw() { openssl rand -hex 24; }
          key() { openssl rand -base64 32; }
          cat > deploy/.env <<ENV
          PUBLIC_URL=http://localhost
          SITE_ADDRESS=:80
          POSTGRES_PASSWORD=$(pw)
          CONTROL_DB_PASSWORD=$(pw)
          TENANT_OWNER_PASSWORD=$(pw)
          TENANT_PROVISIONER_PASSWORD=$(pw)
          TENANT_PLATFORM_PASSWORD=$(pw)
          JWT_SECRET=$(key)
          COOKIE_SECRET=$(key)
          SECRETS_KEY_V1=$(key)
          AUDIT_KEY_V1=$(key)
          EMAIL_TRANSPORT=log
          MAIL_FROM="Smoke Test <no-reply@example.com>"
          ENV
      - name: Build and start
        run: $COMPOSE up -d --build
      - name: Wait for the API through the front door
        run: |
          for i in $(seq 90); do
            if curl -sf http://localhost/api/health >/dev/null; then echo "up after ${i}x2s"; exit 0; fi
            sleep 2
          done
          echo "::error::The stack did not come up"; exit 1
      - name: The release step ran
        run: |
          $COMPOSE logs migrate
          test "$(docker inspect -f '{{.State.ExitCode}}' $($COMPOSE ps -aq migrate))" = 0
      - name: First platform administrator
        run: |
          out=$($COMPOSE run --rm --no-deps api node dist/cli/create-admin.js admin@smoke.test "Smoke Admin")
          echo "$out"
          echo "ADMIN_LINK=$(grep -o 'http[^ ]*accept-invite?token=[^ ]*' <<<"$out")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser
        working-directory: e2e
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Browser journey
        working-directory: e2e
        env:
          APP: http://localhost
          MAIL_CMD: docker compose -f ../deploy/docker-compose.yml logs --no-color api
        run: node smoke.mjs
      - name: Backup
        run: |
          deploy/backup.sh "$PWD/backups"
          ls -la backups
          test "$(gunzip -c backups/db-*.sql.gz | grep -c 'CREATE DATABASE')" -ge 3
          tar -tzf backups/audit-archive-*.tar.gz >/dev/null
      - name: Audit logs verify
        run: $COMPOSE run --rm --no-deps api node dist/cli/audit.js verify
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color --tail=300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-screenshots
          path: e2e/screenshots
          if-no-files-found: ignore
