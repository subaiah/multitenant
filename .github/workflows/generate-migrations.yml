# One-off: writes the first committed migrations with Prisma's schema engine
# (the init schema as on main, then this branch's changes) and commits them
# to the branch. Removed again once the migrations are in.
name: Generate migrations (one-off)

on:
  push:
    branches: [feat/auth-hardening]
    paths: ['.github/workflows/generate-migrations.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://unused:unused@localhost:5432/control
      TENANT_DATABASE_URL: postgresql://unused:unused@localhost:5432/tenant
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Write migrations
        run: |
          set -euo pipefail
          git worktree add /tmp/main origin/main
          MAIN=/tmp/main/backend/prisma
          C=prisma/control/migrations
          T=prisma/tenant/migrations
          mkdir -p $C/00000000000000_init $C/20261016000000_auth_hardening $T/00000000000000_baseline $T/20261016000000_auth_hardening
          mdiff() { npx prisma migrate diff --config "$1" "${@:2}" --script; }
          mdiff prisma.config.ts --from-empty --to-schema $MAIN/control/schema.prisma --output $C/00000000000000_init/migration.sql
          mdiff prisma.config.ts --from-schema $MAIN/control/schema.prisma --to-schema prisma/control/schema.prisma --output $C/20261016000000_auth_hardening/migration.sql
          mdiff prisma.tenant.config.ts --from-empty --to-schema $MAIN/tenant --output $T/00000000000000_baseline/migration.sql
          mdiff prisma.tenant.config.ts --from-schema $MAIN/tenant --to-schema prisma/tenant --output $T/20261016000000_auth_hardening/migration.sql
          for d in $C $T; do
            printf '# Please do not edit this file manually\n# It should be added in your version-control system (e.g., Git)\nprovider = "postgresql"\n' > $d/migration_lock.toml
          done
          find prisma -path '*migrations*' -type f | sort
          cat $C/20261016000000_auth_hardening/migration.sql $T/20261016000000_auth_hardening/migration.sql
      - name: Commit to the branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/control/migrations prisma/tenant/migrations
          git commit -m 'Add the control and tenant migrations (prisma migrate diff)'
          git push origin HEAD:feat/auth-hardening
