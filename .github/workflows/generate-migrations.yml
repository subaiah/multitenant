# One-off: writes the first committed migrations with Prisma's schema engine
# (this branch's schema changes) and commits them
# to the branch. Removed again once the migrations are in.
name: Generate migrations (one-off)

on:
  push:
    branches: [feat/isolation-gaps]
    paths: ['.github/workflows/generate-migrations.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://unused:unused@localhost:5432/control
      TENANT_DATABASE_URL: postgresql://unused:unused@localhost:5432/tenant
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Write migrations
        run: |
          set -euo pipefail
          git worktree add /tmp/main origin/feat/notifications
          MAIN=/tmp/main/backend/prisma
          C=prisma/control/migrations
          T=prisma/tenant/migrations
          mkdir -p $C/20261019000000_isolation_gaps
          mdiff() { npx prisma migrate diff --config "$1" "${@:2}" --script; }
          mdiff prisma.config.ts --from-schema $MAIN/control/schema.prisma --to-schema prisma/control/schema.prisma --output $C/20261019000000_isolation_gaps/migration.sql
          find prisma -path '*migrations*' -type f | sort
          cat $C/20261019000000_isolation_gaps/migration.sql
      - name: Commit to the branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/control/migrations
          git commit -m 'Add the isolation-gaps migration (prisma migrate diff)'
          git push origin HEAD:feat/isolation-gaps
