# The whole platform on one server: Postgres, the release step, the API, and
# Caddy serving the app and the API on one HTTPS address.
#
#   cp .env.example .env      # fill in every value marked REQUIRED
#   docker compose up -d --build
#   docker compose run --rm --no-deps api node dist/cli/create-admin.js you@example.com
#
# Every `up` runs the release step (migrate) first; the API starts only if it
# succeeded. See docs/DEPLOYMENT.md for upgrades, backups and scaling out.

name: multitenant

x-api-env: &api-env
  NODE_ENV: production
  # Control plane, and the tenant database server's three roles
  # (deploy/postgres/init.sh). Generated passwords must be URL-safe (hex).
  DATABASE_URL: postgresql://platform_app:${CONTROL_DB_PASSWORD:?REQUIRED}@db:5432/multitenant
  TENANT_DATABASE_URL: postgresql://tenant_owner:${TENANT_OWNER_PASSWORD:?REQUIRED}@db:5432/multitenant_tenants
  TENANT_PROVISIONER_URL: postgresql://tenant_provisioner:${TENANT_PROVISIONER_PASSWORD:?REQUIRED}@db:5432/postgres
  TENANT_PLATFORM_URL: postgresql://tenant_platform:${TENANT_PLATFORM_PASSWORD:?REQUIRED}@db:5432/multitenant_tenants
  TENANT_ROLE_PREFIX: ${TENANT_ROLE_PREFIX:-tnt_}
  # Where people reach the app. The API is the same address under /api.
  FRONTEND_URL: ${PUBLIC_URL:?REQUIRED}
  BFF_URL: ${PUBLIC_URL}/api
  CORS_ORIGIN: ${PUBLIC_URL}
  # Caddy is the one proxy in front of the API
  TRUST_PROXY: ${TRUST_PROXY:-1}
  # Keys and secrets (32 random bytes, base64; see .env.example)
  JWT_SECRET: ${JWT_SECRET:?REQUIRED}
  COOKIE_SECRET: ${COOKIE_SECRET:?REQUIRED}
  SECRETS_KEY_V1: ${SECRETS_KEY_V1:?REQUIRED}
  AUDIT_KEY_V1: ${AUDIT_KEY_V1:?REQUIRED}
  # Add SECRETS_KEY_V2 / AUDIT_KEY_V2 here when rotating (docs/DEPLOYMENT.md)
  # Email
  EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:?REQUIRED}
  # Optional settings (backend/.env.example lists them all)
  DEFAULT_TENANT_STRATEGY: ${DEFAULT_TENANT_STRATEGY:-SHARED_TABLES}
  PLATFORM_MFA_REQUIRED: ${PLATFORM_MFA_REQUIRED:-true}
  SUPPORT_SELF_APPROVAL: ${SUPPORT_SELF_APPROVAL:-false}
  PREVIEW_FEATURES: ${PREVIEW_FEATURES:-false}
  SELF_SIGNUP: ${SELF_SIGNUP:-true}
  SIGNUP_PLAN: ${SIGNUP_PLAN:-FREE}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  TRIAL_DAYS: ${TRIAL_DAYS:-14}
  CLOSE_GRACE_DAYS: ${CLOSE_GRACE_DAYS:-30}
  CUSTOM_DOMAINS: ${CUSTOM_DOMAINS:-true}
  CUSTOM_DOMAIN_TARGET: ${CUSTOM_DOMAIN_TARGET:-}
  API_DOCS: ${API_DOCS:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Billing (optional, docs/BILLING.md): Razorpay for INR, Stripe for other currencies
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-7}
  # Error tracking (optional): Sentry projects' DSNs (docs/DEPLOYMENT.md)
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_FRONTEND_DSN: ${SENTRY_FRONTEND_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  APP_VERSION: ${APP_VERSION:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?REQUIRED}
      # Read by postgres/init.sh on the first start only
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD}
      TENANT_OWNER_PASSWORD: ${TENANT_OWNER_PASSWORD}
      TENANT_PROVISIONER_PASSWORD: ${TENANT_PROVISIONER_PASSWORD}
      TENANT_PLATFORM_PASSWORD: ${TENANT_PLATFORM_PASSWORD}
      TENANT_ROLE_PREFIX: ${TENANT_ROLE_PREFIX:-tnt_}
    # Each database-per-tenant tenant has its own connection pool on every API server
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-multitenant.sh:ro
      - ../backend/prisma/tenant/setup-roles.sql:/opt/multitenant/setup-roles.sql:ro
    healthcheck:
      # Over TCP: during the first start's setup Postgres only listens on a
      # socket, and the API mustn't start before that setup has finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d multitenant"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: only the API reaches it. To connect from the host, use
    # `docker compose exec db psql -U postgres`.

  # The release step: control-plane and tenant migrations, then it exits
  migrate:
    image: ${API_IMAGE:-multitenant-api:local}
    build: ../backend
    command: ["node", "dist/cli/migrate.js"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ${API_IMAGE:-multitenant-api:local}
    build: ../backend
    restart: unless-stopped
    environment:
      <<: *api-env
      # false when the worker below runs the background jobs
      RUN_JOBS: ${API_RUN_JOBS:-true}
    volumes:
      - audit-archive:/data/audit-archive
      - exports:/data/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s

  # Optional: the background jobs (notifications, data exports, audit
  # archiving, trials) in their own container, so heavy work doesn't slow the
  # API. To use it, set in .env:  COMPOSE_PROFILES=worker  and  API_RUN_JOBS=false
  worker:
    image: ${API_IMAGE:-multitenant-api:local}
    build: ../backend
    profiles: [worker]
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment: *api-env
    volumes:
      - audit-archive:/data/audit-archive
      - exports:/data/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s

  # Nightly backups (deploy/backup/): every database and the audit archive,
  # test-restored, optionally encrypted and copied to object storage. Files
  # are kept in deploy/backups/ too. Back up now: deploy/backup.sh; restore:
  # deploy/restore.sh. Set up: docs/DEPLOYMENT.md, "Backups".
  backup:
    image: multitenant-backup:local
    build:
      context: .
      dockerfile: backup.Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Daily, HH:MM in TZ (UTC by default; TZ=Asia/Kolkata for Indian time)
      BACKUP_TIME: ${BACKUP_TIME:-02:15}
      TZ: ${BACKUP_TZ:-UTC}
      BACKUP_KEEP_LOCAL: ${BACKUP_KEEP_LOCAL:-7}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_VERIFY: ${BACKUP_VERIFY:-true}
      # An age public key (age1...): backups are encrypted to it
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      # A healthchecks.io (or similar) URL: alerts when a backup fails or doesn't happen
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      # S3-compatible object storage (Oracle Object Storage, Backblaze B2, AWS S3, ...)
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-multitenant}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_S3_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes:
      - ./backups:/backups
      - audit-archive:/audit-archive
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-multitenant-web:local}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        APP_NAME: ${APP_NAME:-Multitenant}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  # Audit log entries past AUDIT_RETENTION_DAYS: back these up with the database
  audit-archive:
  # Organizations' data exports, kept EXPORT_RETENTION_DAYS (no need to back up)
  exports:
  # Caddy's certificates
  caddy-data:
  caddy-config:
